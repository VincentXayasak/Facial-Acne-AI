<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facial Acne Research Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1a2332;
      --muted: #5c6b7a;
      --accent: #2d6cdf;
      --accent-hover: #2458b8;
      --border: #dce4ee;
      --user-bg: #e8f0fe;
      --error: #b42318;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app {
      display: flex;
      height: 100vh;
      max-height: 100dvh;
    }
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-head {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-head h1 { font-size: 1rem; margin: 0 0 0.25rem; font-weight: 600; }
    .sidebar-head .sub { font-size: 0.75rem; color: var(--muted); margin: 0; }
    .btn-new {
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.55rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-new:hover { background: var(--accent-hover); }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .history-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.6rem 0.65rem;
      margin-bottom: 0.25rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 0.82rem;
      color: var(--text);
    }
    .history-item:hover { background: #f1f5f9; }
    .history-item.active { background: var(--user-bg); color: var(--accent); font-weight: 600; }
    .history-item .title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item .date { font-size: 0.7rem; color: var(--muted); }
    .btn-clear {
      margin: 0.5rem;
      padding: 0.45rem;
      font-size: 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .toolbar {
      padding: 0.65rem 1rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }
    .toggle input { accent-color: var(--accent); }
    #status { color: var(--muted); flex: 1; min-width: 120px; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 3rem 1rem;
      font-size: 0.95rem;
    }
    .msg {
      max-width: 92%;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-radius: 12px 12px 4px 12px;
      padding: 0.75rem 1rem;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px 12px 12px 4px;
      padding: 0.85rem 1rem;
      max-width: 95%;
    }
    .msg-role {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .msg-body { font-size: 0.95rem; line-height: 1.65; }
    .msg-body.streaming .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .msg-meta {
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
    }
    .msg-meta details summary { cursor: pointer; color: var(--accent); }
    .sources-mini { list-style: none; padding: 0.4rem 0 0; margin: 0; }
    .sources-mini li { padding: 0.2rem 0; }
    .composer {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 0.85rem 1rem 1rem;
    }
    .composer textarea {
      width: 100%;
      min-height: 72px;
      padding: 0.65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      resize: vertical;
    }
    .composer-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }
    .composer-row input[type="file"] { font-size: 0.8rem; max-width: 200px; }
    #preview {
      width: 48px; height: 48px; object-fit: cover;
      border-radius: 6px; border: 1px solid var(--border); display: none;
    }
    .btn-send {
      margin-left: auto;
      padding: 0.6rem 1.25rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-send:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-send:disabled { opacity: 0.6; cursor: not-allowed; }
    .err {
      margin: 0 1rem 0.5rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--error);
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }
    .err.visible { display: block; }
    .msg-body h1, .msg-body h2, .msg-body h3 { margin: 0.85rem 0 0.4rem; font-size: 1.05rem; }
    .msg-body p { margin: 0 0 0.65rem; }
    .msg-body ul, .msg-body ol { margin: 0 0 0.65rem; padding-left: 1.25rem; }
    .msg-body li { margin-bottom: 0.25rem; }
    .msg-body strong { font-weight: 600; }
    @media (max-width: 720px) {
      .sidebar { width: 200px; }
      .msg.user, .msg.assistant { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h1>Facial Acne AI Assistant</h1>
        <p class="sub">AI Responses Can Be Wrong, Please Verify With A Doctor</p>
        <button type="button" class="btn-new" id="btn-new">+ New chat</button>
      </div>
      <div class="history-list" id="history-list"></div>
      <button type="button" class="btn-clear" id="btn-clear">Clear all history</button>
    </aside>

    <div class="main">
      <div class="toolbar">
        <label class="toggle">
          <input type="checkbox" id="use_rag" checked />
          Use research papers (RAG)
        </label>
        <span id="status"></span>
      </div>
      <div id="error" class="err" role="alert"></div>
      <div class="messages" id="messages"></div>
      <form id="form" class="composer">
        <textarea id="question" name="question" required
          placeholder="Ask about causes, treatments, or what studies say…"></textarea>
        <div class="composer-row">
          <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp" />
          <img id="preview" alt="" />
          <button type="submit" class="btn-send" id="submit">Send</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    marked.setOptions({ breaks: true, gfm: true });

    const STORAGE_KEY = "acne_assistant_sessions";
    const state = {
      sessions: [],
      currentId: null,
      streaming: false,
      streamMarkdown: "",
    };

    const historyList = document.getElementById("history-list");
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const questionEl = document.getElementById("question");
    const imageInput = document.getElementById("image");
    const preview = document.getElementById("preview");
    const submitBtn = document.getElementById("submit");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const useRagEl = document.getElementById("use_rag");

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);
    }

    function loadSessions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        state.sessions = raw ? JSON.parse(raw) : [];
      } catch {
        state.sessions = [];
      }
      if (!state.sessions.length) {
        createSession(false);
      } else if (!state.currentId || !state.sessions.find((s) => s.id === state.currentId)) {
        state.currentId = state.sessions[0].id;
      }
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.sessions));
    }

    function currentSession() {
      return state.sessions.find((s) => s.id === state.currentId);
    }

    function createSession(select = true) {
      const session = {
        id: uid(),
        title: "New chat",
        updatedAt: new Date().toISOString(),
        messages: [],
      };
      state.sessions.unshift(session);
      if (select) state.currentId = session.id;
      saveSessions();
      renderHistory();
      renderMessages();
    }

    function sessionTitle(session) {
      const first = session.messages.find((m) => m.role === "user");
      if (first) return first.content.slice(0, 48) + (first.content.length > 48 ? "…" : "");
      return "New chat";
    }

    function renderHistory() {
      historyList.innerHTML = "";
      state.sessions.forEach((s) => {
        s.title = sessionTitle(s);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "history-item" + (s.id === state.currentId ? " active" : "");
        btn.innerHTML =
          `<span class="title">${escapeHtml(s.title)}</span>` +
          `<span class="date">${new Date(s.updatedAt).toLocaleString()}</span>`;
        btn.onclick = () => {
          state.currentId = s.id;
          renderHistory();
          renderMessages();
        };
        historyList.appendChild(btn);
      });
    }

    function renderMarkdown(md, streaming) {
      const html = DOMPurify.sanitize(marked.parse(md || ""));
      return html + (streaming ? '<span class="cursor"></span>' : "");
    }

    function renderMessages() {
      const session = currentSession();
      messagesEl.innerHTML = "";
      if (!session || !session.messages.length) {
        messagesEl.innerHTML =
          '<p class="empty-state">Upload an optional face photo and ask a question. ' +
          "Past chats are saved in the sidebar.</p>";
        return;
      }
      session.messages.forEach((msg, idx) => {
        const div = document.createElement("div");
        div.className = "msg " + msg.role;
        const roleLabel = msg.role === "user" ? "You" : "Assistant";
        let metaHtml = "";
        if (msg.role === "assistant" && msg.meta) {
          const parts = [];
          if (msg.meta.use_rag !== undefined) {
            parts.push(msg.meta.use_rag ? "RAG (research papers)" : "Base model");
          }
          if (msg.meta.sources && msg.meta.sources.length) {
            const items = msg.meta.sources
              .map(
                (s) =>
                  `<li><strong>[${s.cite}]</strong> ${escapeHtml(s.title)}</li>`
              )
              .join("");
            parts.push(
              `<details><summary>Sources (${msg.meta.sources.length})</summary>` +
              `<ul class="sources-mini">${items}</ul></details>`
            );
          }
          if (msg.meta.observation) {
            parts.push(
              `<details><summary>Vision notes</summary><pre style="white-space:pre-wrap;font-size:0.72rem">${escapeHtml(JSON.stringify(msg.meta.observation, null, 2))}</pre></details>`
            );
          }
          if (parts.length) {
            metaHtml = `<div class="msg-meta">${parts.join("")}</div>`;
          }
        }
        const isLastStreaming =
          state.streaming &&
          idx === session.messages.length - 1 &&
          msg.role === "assistant";
        div.innerHTML =
          `<div class="msg-role">${roleLabel}</div>` +
          `<div class="msg-body${isLastStreaming ? " streaming" : ""}">${renderMarkdown(msg.content, isLastStreaming)}</div>` +
          metaHtml;
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    let renderScheduled = false;
    function scheduleStreamRender() {
      if (renderScheduled) return;
      renderScheduled = true;
      requestAnimationFrame(() => {
        renderScheduled = false;
        const session = currentSession();
        if (!session) return;
        const last = session.messages[session.messages.length - 1];
        if (last && last.role === "assistant") {
          last.content = state.streamMarkdown;
          renderMessages();
        }
      });
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function historyForApi(session) {
      return session.messages.map((m) => ({
        role: m.role,
        content: m.content,
      }));
    }

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (!file) {
        preview.style.display = "none";
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });

    document.getElementById("btn-new").onclick = () => createSession(true);
    document.getElementById("btn-clear").onclick = () => {
      if (!confirm("Delete all chat history on this device?")) return;
      state.sessions = [];
      createSession(true);
    };

    async function consumeSSE(reader, session, assistantMsg) {
      const decoder = new TextDecoder();
      let buffer = "";
      state.streamMarkdown = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";

        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith("data:")) continue;
          const event = JSON.parse(line.slice(5).trim());

          if (event.type === "status") {
            statusEl.textContent = event.message;
          } else if (event.type === "meta") {
            assistantMsg.meta = {
              use_rag: event.use_rag,
              observation: event.observation,
              sources: event.sources,
            };
            statusEl.textContent = "Writing answer…";
            renderMessages();
          } else if (event.type === "token") {
            state.streamMarkdown += event.text;
            scheduleStreamRender();
          } else if (event.type === "error") {
            throw new Error(event.message);
          } else if (event.type === "done") {
            assistantMsg.content = state.streamMarkdown;
            state.streaming = false;
            session.updatedAt = new Date().toISOString();
            saveSessions();
            renderHistory();
            renderMessages();
          }
        }
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const session = currentSession();
      if (!session) return;

      const question = questionEl.value.trim();
      if (!question) return;

      errorEl.classList.remove("visible");
      submitBtn.disabled = true;
      state.streaming = true;

      const userMsg = {
        role: "user",
        content: question,
        use_rag: useRagEl.checked,
      };
      session.messages.push(userMsg);

      const assistantMsg = { role: "assistant", content: "", meta: null };
      session.messages.push(assistantMsg);

      questionEl.value = "";
      renderMessages();

      const fd = new FormData();
      fd.append("question", question);
      fd.append("use_rag", useRagEl.checked ? "true" : "false");
      fd.append(
        "history",
        JSON.stringify(session.messages.slice(0, -2).map((m) => ({
          role: m.role,
          content: m.content,
        })))
      );
      if (imageInput.files[0]) {
        fd.append("image", imageInput.files[0]);
        imageInput.value = "";
        preview.style.display = "none";
      }

      try {
        statusEl.textContent = "Starting…";
        const res = await fetch("/api/ask/stream", { method: "POST", body: fd });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || res.statusText);
        }
        await consumeSSE(res.body.getReader(), session, assistantMsg);
      } catch (err) {
        session.messages.pop();
        session.messages.pop();
        errorEl.textContent = err.message;
        errorEl.classList.add("visible");
        state.streaming = false;
        renderMessages();
      } finally {
        submitBtn.disabled = false;
        statusEl.textContent = "";
        saveSessions();
        renderHistory();
      }
    });

    loadSessions();
    renderHistory();
    renderMessages();
  </script>
</body>
</html>
